name: CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [ main, develop ]
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    # services:
    #   postgres:
    #     image: postgres:15
    #     env:
    #       POSTGRES_USER: postgres
    #       POSTGRES_PASSWORD: password
    #       POSTGRES_DB: resulttrack_test
    #     ports:
    #       - 5432:5432
    #     options: >-
    #       --health-cmd pg_isready
    #       --health-interval 10s
    #       --health-timeout 5s
    #       --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # - name: Run Prisma Migrations
      #   run: npx prisma migrate deploy
      #   env:
      #     DATABASE_URL: postgresql://postgres:password@localhost:5432/resulttrack_test?schema=public

      - name: Validate Prisma Schema
        run: npx prisma validate
        env:
           DATABASE_URL: postgresql://user:password@localhost:5432/dummy

      - name: Run TypeScript Compile Check
        run: npm run typecheck


      - name: Run Test Suite
        run: npm test
        env:
         # DATABASE_URL: postgresql://postgres:password@localhost:5432/resulttrack_test?schema=public
          JWT_SECRET: test_jwt_secret
          PORT: 5000
          EMAIL_HOST: localhost
          EMAIL_PORT: 1025
          EMAIL_USER: test_user
          EMAIL_PASS: test_pass
          NODE_ENV: test
