name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: resulttrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/resulttrack_test?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Run Prisma Migrations
        run: npx prisma migrate deploy

      - name: Build application
        run: npm run build

      - name: Run TypeScript Compile Check
        run: npm run typecheck

      - name: Run Seed Script
        run: npx ts-node prisma/seed.ts
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/resulttrack_test?schema=public
          SUPER_ADMIN_PASSWORD: test_super_admin_password
          SUPER_ADMIN_FIRST_NAME: test_super_admin
          SUPER_ADMIN_EMAIL: test_super_admin@example.com

      - name: Run Test Suite
        run: npm test
        env:
          SESSION_SECRET: test_jwt_secret
          PORT: 5000
          EMAIL_HOST: localhost
          EMAIL_PORT: 1025
          EMAIL_USER: test_user
          EMAIL_PASS: test_pass
          NODE_ENV: test